services:
  - type: web
    name: oracle-a1-dashboard
    runtime: python
    buildCommand: pip install poetry && poetry install
    startCommand: gunicorn --bind 0.0.0.0:$PORT app:app
    envVars:
      - key: FLASK_ENV
        value: production
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: OCI_CONFIG_FILE
        value: ~/.oci/config
      - key: PYTHONUNBUFFERED
        value: "true"
      # Email configuration (optional)
      - key: SMTP_SERVER
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: 587
      # Add these secrets in Render dashboard:
      # - SMTP_USER (your gmail address)
      # - SMTP_PASSWORD (gmail app password)
      # - OCI_USER (your Oracle user OCID)
      # - OCI_FINGERPRINT (your API key fingerprint)
      # - OCI_TENANCY (your tenancy OCID)
      # - OCI_PRIVATE_KEY (your private key content)

    # Ensure the .oci directory exists with your credentials
    preDeployCommand: |
      mkdir -p ~/.oci
      echo "$OCI_CONFIG" > ~/.oci/config
      echo "$OCI_PRIVATE_KEY" > ~/.oci/id_rsa.pem
      chmod 600 ~/.oci/config ~/.oci/id_rsa.pem
